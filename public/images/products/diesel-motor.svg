<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="dieselRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="flywheel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="50%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#dmBg)" rx="24"/>
  <circle cx="300" cy="225" r="170" fill="#dc2626" opacity="0.08"/>
  <!-- Engine Base -->
  <rect x="120" y="330" width="360" height="25" rx="8" fill="#0c0a09" stroke="#44403c" stroke-width="4"/>
  <!-- Crankcase & Cylinder Block -->
  <rect x="220" y="180" width="160" height="150" rx="12" fill="url(#dieselRed)" stroke="#450a0a" stroke-width="4"/>
  <!-- Cylinder Head & Rocker Cover -->
  <rect x="240" y="130" width="120" height="50" rx="8" fill="#292524" stroke="#57534e" stroke-width="3"/>
  <!-- Injector Unit -->
  <rect x="290" y="105" width="20" height="25" rx="3" fill="#ca8a04"/>
  <path d="M300 105 L300 90 L260 90" stroke="#ca8a04" stroke-width="3" fill="none"/>
  <!-- Large Flywheel (Right) -->
  <circle cx="430" cy="255" r="70" fill="url(#flywheel)" stroke="#292524" stroke-width="6"/>
  <circle cx="430" cy="255" r="45" fill="#1c1917" stroke="#57534e" stroke-width="3"/>
  <circle cx="430" cy="255" r="18" fill="#ca8a04"/>
  <!-- Air Cleaner / Oil Bath Filter (Left) -->
  <cylinder cx="170" cy="190" rx="30" ry="60"/>
  <rect x="150" y="150" width="50" height="80" rx="20" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <path d="M175 230 L175 250 L220 250" stroke="#0f172a" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Exhaust Muffler (Top Left) -->
  <rect x="190" y="110" width="40" height="60" rx="10" fill="#44403c" stroke="#1c1917" stroke-width="3"/>
  <path d="M210 110 L210 80" stroke="#78716c" stroke-width="8" stroke-linecap="round"/>
  <!-- Fuel Tank (Top Right) -->
  <rect x="330" y="90" width="100" height="45" rx="10" fill="#b91c1c" stroke="#7f1d1d" stroke-width="3"/>
  <circle cx="380" cy="85" r="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="300" y="415" fill="#fca5a5" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">محرك ديزل زراعي خدمة شاقة - LKL DM-186</text>
</svg>
