<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="tillerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="tillerOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#tillerBg)" rx="24"/>
  <circle cx="300" cy="225" r="160" fill="#ea580c" opacity="0.1"/>
  <!-- Engine block -->
  <rect x="230" y="160" width="120" height="110" rx="14" fill="url(#tillerOrange)" stroke="#9a3412" stroke-width="4"/>
  <!-- Fuel Tank (Top) -->
  <rect x="240" y="120" width="100" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <rect x="280" y="108" width="20" height="12" rx="3" fill="#334155"/>
  <!-- Mud Guard / Fender -->
  <path d="M190 270 Q 290 240 390 270 L 410 290 L 170 290 Z" fill="#334155" stroke="#1e293b" stroke-width="3"/>
  <!-- Rotary Cultivator Blades (Bottom) -->
  <circle cx="290" cy="335" r="45" fill="#0f172a" stroke="#ca8a04" stroke-width="4"/>
  <line x1="290" y1="290" x2="290" y2="380" stroke="#ca8a04" stroke-width="6" stroke-linecap="round"/>
  <line x1="245" y1="335" x2="335" y2="335" stroke="#ca8a04" stroke-width="6" stroke-linecap="round"/>
  <line x1="258" y1="303" x2="322" y2="367" stroke="#ca8a04" stroke-width="6" stroke-linecap="round"/>
  <line x1="322" y1="303" x2="258" y2="367" stroke="#ca8a04" stroke-width="6" stroke-linecap="round"/>
  <!-- Long Control Handles / Steering -->
  <path d="M260 220 L 150 140 L 120 145" stroke="#cbd5e1" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M280 220 L 170 120 L 140 125" stroke="#94a3b8" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Handle Grips -->
  <rect x="115" y="138" width="25" height="14" rx="4" fill="#1e293b"/>
  <rect x="135" y="118" width="25" height="14" rx="4" fill="#1e293b"/>
  <text x="300" y="415" fill="#fed7aa" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">عزاقة وتقليبة زراعية ميكانيكية - LKL RT-750</text>
</svg>
