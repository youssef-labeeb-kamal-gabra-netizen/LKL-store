<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="irrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="filterBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#irrBg)" rx="24"/>
  <circle cx="300" cy="225" r="170" fill="#22c55e" opacity="0.1"/>
  <!-- Pipeline Manifold (Bottom) -->
  <rect x="100" y="280" width="400" height="35" rx="8" fill="#1c1917" stroke="#334155" stroke-width="4"/>
  <circle cx="100" cy="297" r="24" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
  <circle cx="500" cy="297" r="24" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
  <!-- Dual Disc Filter Columns -->
  <!-- Filter 1 -->
  <rect x="180" y="140" width="90" height="140" rx="20" fill="url(#filterBody)" stroke="#052e16" stroke-width="4"/>
  <rect x="195" y="105" width="60" height="35" rx="8" fill="#0f172a"/>
  <!-- Clamp Ring -->
  <rect x="175" y="200" width="100" height="15" rx="4" fill="#ca8a04"/>
  <!-- Filter 2 -->
  <rect x="330" y="140" width="90" height="140" rx="20" fill="url(#filterBody)" stroke="#052e16" stroke-width="4"/>
  <rect x="345" y="105" width="60" height="35" rx="8" fill="#0f172a"/>
  <!-- Clamp Ring 2 -->
  <rect x="325" y="200" width="100" height="15" rx="4" fill="#ca8a04"/>
  <!-- Pressure Gauges -->
  <circle cx="225" cy="85" r="16" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <path d="M225 85 L234 80" stroke="#dc2626" stroke-width="2"/>
  <circle cx="375" cy="85" r="16" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <path d="M375 85 L384 80" stroke="#dc2626" stroke-width="2"/>
  <!-- Drip lines & Sprinklers representation -->
  <line x1="120" y1="360" x2="480" y2="360" stroke="#0284c7" stroke-width="4" stroke-dasharray="10 8"/>
  <circle cx="200" cy="360" r="6" fill="#38bdf8"/>
  <circle cx="300" cy="360" r="6" fill="#38bdf8"/>
  <circle cx="400" cy="360" r="6" fill="#38bdf8"/>
  <text x="300" y="415" fill="#86efac" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">فلاتر ومستلزمات شبكات الري الحديث - LKL IRR-F200</text>
</svg>
